[package]
name = "dfwrap"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["staticlib"]

[dependencies]
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d8309e0935d165700c91da9de862a99c31", default-features = false, features = ["tract"] }
ndarray = "^0.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
